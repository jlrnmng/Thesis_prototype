<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirely – Job Listings</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: #f9fbfa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* === Dashboard Header === */
    header {
      background: #2eccb0;
      color: #000000;
      padding: 22px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .logo img {
      height: 45px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .signin-btn {
      background: #16395f;
      padding: 8px 20px;
      border-radius: 20px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .signin-btn:hover {
      background: #122c4d;
    }

    /* === Main Layout === */
    main {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
      flex: 1;
    }

    .content-wrapper {
      display: flex;
      gap: 30px;
      max-width: 1100px;
      width: 100%;
    }

    .jobs-list {
      flex: 1;
      max-width: 320px;
    }

    .jobs-list h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 18px;
      color: #2c3e50;
    }

    .job-card {
      background: #fff;
      border: 1px solid #e5f2ef;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }
    .job-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transform: translateY(-1px);
    }
    .job-card h3 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      color: #2c3e50;
    }
    .job-card p {
      margin: 0;
      font-size: 13px;
      color: #555;
    }

    .divider {
      width: 1px;
      background: #e1e1e1;
      align-self: stretch;
    }

    .job-details {
      flex: 2;
      background: #fff;
      border: 1px solid #e5f2ef;
      border-radius: 6px;
      padding: 28px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      line-height: 1.6;
    }
    .job-details h2 {
      margin-top: 0;
      font-size: 20px;
      font-weight: 600;
      color: #2c3e50;
    }
    .job-details p {
      font-size: 14px;
      color: #444;
    }

    .flash-messages {
      max-width: 600px;
      margin: 0 auto;
    }

    .alert {
      border-radius: 10px;
      font-weight: 500;
      padding: 12px 18px;
    }


    footer {
      text-align: center;
      padding: 18px;
      background: #f3f9f7;
      font-size: 14px;
      color: #555;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Dashboard -->
  <header>
    <div class="logo">
      <img src="/static/hirely_logo.png" alt="Hirely Logo">
    </div>
    <nav>
      <a href="#">Employers</a>
      <a href="/login" class="signin-btn">Sign In</a>
      <a href="/admin_register">Employers/Post Job</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <div class="content-wrapper">
      <!-- Jobs List -->
      <div class="jobs-list">
        <h2>Available Jobs</h2>
        {% for job in jobs %}
        <div class="job-card"
             data-title="{{ job.role }}"
             data-description="{{ job.description }}"
             onclick="showJobDetails(this.dataset.title, this.dataset.description)">
          <h3>{{ job.role }}</h3>
          <p>{{ job.description[:60] }}...</p>
        </div>
        {% endfor %}
      </div>

      <div class="divider"></div>

      <!-- Job Details -->
      <div class="job-details" id="jobDetails">
        <h2>Job Description</h2>
        <p>Select a job from the list to view details here.</p>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 Hirely. All rights reserved.
  </footer>

  <script>
    function showJobDetails(title, description) {
      const details = document.getElementById("jobDetails");
      details.innerHTML = `
        <h2>${title}</h2>
        <p>${description}</p>
      `;
    }
  </script>

</body>
</html>
